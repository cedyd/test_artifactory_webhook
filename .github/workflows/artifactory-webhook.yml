name: Artifactory Webhook Handler

on:
  repository_dispatch:
    types: [artifactory-update]

jobs:
  handle-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Print Webhook Payload
        run: |
          echo "Webhook Event Type: ${{ github.event.action }}"
          echo "Full Payload:"
          echo '${{ toJson(github.event.client_payload) }}'